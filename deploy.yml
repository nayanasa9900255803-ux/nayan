- name:Deploy Maven Artifact
  hosts:web
  become:yes
  tasks:
    - name:copy jar file
      copy:
        src:/var/lib/jenkins/workspace/mavenproj/maven_example/target/maven-example-1.0-SNAPSHOT.jar
        dest:/apt/maven-example-1.0-SNAPSHOT.jar
    - name:run application
      shell:nohup java -jar /opt/maven_example-1.0-SNAPSHOT.jar&
